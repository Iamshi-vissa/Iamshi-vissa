<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="CommitRad — Scores every commit — even unpushed ones — for the risk it will need a bug fix, and explains why."><style>.dr{animation:dr 1.4s ease-out 0.05s forwards}@keyframes dr{to{stroke-dashoffset:0}}.up{animation:up .7s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="2" y="2" width="586" height="266" fill="#111111"/>
  <rect class="dr" x="2" y="2" width="586" height="266" fill="none" stroke="#4D4D4D" stroke-width="1.5" stroke-dasharray="1704" stroke-dashoffset="1704"/>
  <g class="up" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="26" y="38" font-size="11.5" letter-spacing="3" fill="#9A9A9A">01 / ML · DEV TOOLS</text>
    <text x="564" y="38" text-anchor="end" font-size="16" fill="#9A9A9A">↗</text>
    <text x="26" y="80" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="600" fill="#FAFAFA">CommitRad</text>
    <text x="26" y="114" font-size="14" fill="#FAFAFA">Scores every commit — even unpushed ones — for the</text>
    <text x="26" y="135" font-size="14" fill="#FAFAFA">risk it will need a bug fix, and explains why.</text>
    <text x="26" y="168" font-size="12.5" fill="#9A9A9A">— LightGBM trained on 27,384 commits from 16 repos</text>
    <text x="26" y="189" font-size="12.5" fill="#9A9A9A">— CLI · pre-push hook · CI step · web UI</text>
    <rect x="26" y="216" width="67" height="26" fill="none" stroke="#4D4D4D"/><text x="36" y="233" font-size="13" fill="#FAFAFA">Python</text><rect x="101" y="216" width="82" height="26" fill="none" stroke="#4D4D4D"/><text x="111" y="233" font-size="13" fill="#FAFAFA">LightGBM</text><rect x="191" y="216" width="67" height="26" fill="none" stroke="#4D4D4D"/><text x="201" y="233" font-size="13" fill="#FAFAFA">DuckDB</text><rect x="266" y="216" width="75" height="26" fill="none" stroke="#4D4D4D"/><text x="276" y="233" font-size="13" fill="#FAFAFA">FastAPI</text><rect x="349" y="216" width="59" height="26" fill="none" stroke="#4D4D4D"/><text x="359" y="233" font-size="13" fill="#FAFAFA">React</text>
