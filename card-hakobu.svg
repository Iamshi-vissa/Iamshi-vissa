<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Hakobu — Universal file converter: detects what a file really is from its bytes, converts with live progress."><style>.dr{animation:dr 1.4s ease-out 0.10s forwards}@keyframes dr{to{stroke-dashoffset:0}}.up{animation:up .7s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="2" y="2" width="586" height="266" fill="#111111"/>
