name: Grow the maple tree

on:
  schedule:
    - cron: "23 */12 * * *"   # twice a day
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: [maple_gen.py, .github/workflows/profile-stats.yml]

permissions:
  contents: write

jobs:
  maple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grow maple.svg from the contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 maple_gen.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maple.svg
          git diff --cached --quiet || git commit -m "chore: the maple tree grows"
          git push
